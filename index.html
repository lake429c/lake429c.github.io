<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Random Walk Color Animation</title>
		<style>
			body,
			html {
				margin: 0;
				padding: 0;
				overflow: hidden;
				background-color: black;
			}
			canvas {
				display: block;
			}
		</style>
	</head>
	<body>
		<canvas id="canvas"></canvas>

		<script>
			const canvas = document.getElementById("canvas");
			const ctx = canvas.getContext("2d");

			// フルスクリーンに対応する
			canvas.width = window.innerWidth;
			canvas.height = window.innerHeight;

			let running = true;
			let fps = 10;
			let moveDirectionType = true;
			let x = Math.floor(canvas.width / 2);
			let y = Math.floor(canvas.height / 2);
			let stepSize = 2;
			let colorX = 0;

			// RGB値を計算
			function getColor(x) {
				let r = (255 * (1 + Math.sin(x))) / 2;
				let g = (255 * (1 + Math.sin(x + (2 * Math.PI) / 3))) / 2;
				let b = (255 * (1 + Math.sin(x + (4 * Math.PI) / 3))) / 2;
				return `rgb(${Math.floor(r)}, ${Math.floor(g)}, ${Math.floor(
					b
				)})`;
			}

			// ランダムな方向に移動する
			function moveRandomly() {
				const directions1 = [
					{ dx: 0, dy: -5 }, // 上
					{ dx: 4, dy: 3 }, // 右下
					{ dx: -4, dy: 3 }, // 左下
				];
				const directions2 = [
					{ dx: 0, dy: 5 }, // 下
					{ dx: 4, dy: -3 }, // 右上
					{ dx: -4, dy: -3 }, // 左上
				];
				const randomDirection = moveDirectionType
					? directions1[
							Math.floor(Math.random() * directions1.length)
					  ]
					: directions2[
							Math.floor(Math.random() * directions2.length)
					  ];
				x += randomDirection.dx * stepSize;
				y += randomDirection.dy * stepSize;
				moveDirectionType = !moveDirectionType;

				// 画面外に出ないように調整
				//x = Math.max(0, Math.min(canvas.width - 1, x));
				//y = Math.max(0, Math.min(canvas.height - 1, y));
			}

			function fillTriangle(preX, preY) {
				// 塗る
				ctx.fillStyle = getColor(colorX);
				ctx.beginPath();
				ctx.moveTo(preX, preY);
				ctx.lineTo(x, y);
				if (x == preX) {
					ctx.lineTo(
						(x + preX) / 2 + (y - preY) / 8,
						(y + preY) / 2 + (x - preX) / 8
					);
				} else if ((x - preX) * (y - preY) > 0) {
					ctx.lineTo(x - (y - preY) / 2, y - (x - preX) / 2);
				} else if ((x - preX) * (y - preY) < 0) {
					ctx.lineTo(preX - (y - preY) / 2, preY - (x - preX) / 2);
				}
				ctx.fill();
			}

			// 描画のループ
			function draw() {
				if (!running) return;

				let preX = x;
				let preY = y;

				// 次の座標へランダム移動
				moveRandomly();

				// 塗る
				fillTriangle(preX, preY);

				// ウィンドウ端を越えていた場合は補正する
				let fixFlag = false;
				if (x < 0) {
					fixFlag = true;
					x += canvas.width - 1;
					preX += canvas.width - 1;
				} else if (x > canvas.width - 1) {
					fixFlag = true;
					x -= canvas.width - 1;
					preX -= canvas.width - 1;
				}
				if (y < 0) {
					fixFlag = true;
					y += canvas.height - 1;
					preY += canvas.height - 1;
				} else if (y > canvas.height - 1) {
					fixFlag = true;
					y -= canvas.height - 1;
					preY -= canvas.height - 1;
				}

				// 塗る（補正分）
				if (fixFlag) fillTriangle(preX, preY);

				// 色を更新
				colorX += Math.PI / 360;

				// ループを指定したFPSで実行
				setTimeout(draw, 1000 / fps);
			}

			// クリックで停止/再開の切り替え
			canvas.addEventListener("click", () => {
				running = !running;
				if (running) draw();
			});

			// 最初の描画
			draw();
		</script>
	</body>
</html>
