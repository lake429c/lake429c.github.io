<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Walk Color Animation</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: black;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // フルスクリーンに対応する
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let running = true;
        let fps = 10;
        let x = Math.floor(canvas.width / 2);
        let y = Math.floor(canvas.height / 2);
        let colorX = 0;

        // 初期色のRGB値を計算
        function getColor(x) {
            let r = 255 * (1 + Math.sin(x)) / 2;
            let g = 255 * (1 + Math.sin(x + (2 * Math.PI / 3))) / 2;
            let b = 255 * (1 + Math.sin(x + (4 * Math.PI / 3))) / 2;
            return `rgb(${Math.floor(r)}, ${Math.floor(g)}, ${Math.floor(b)})`;
        }

        // ランダムな方向に移動する
        function moveRandomly() {
            const directions = [
                { dx: 0, dy: -1 }, // 上
                { dx: 0, dy: 1 },  // 下
                { dx: 1, dy: 0 },  // 右
                { dx: -1, dy: 0 }  // 左
            ];
            const randomDirection = directions[Math.floor(Math.random() * directions.length)];
            x += randomDirection.dx;
            y += randomDirection.dy;

            // 画面外に出ないように調整
            x = Math.max(0, Math.min(canvas.width - 1, x));
            y = Math.max(0, Math.min(canvas.height - 1, y));
        }

        // 描画のループ
        function draw() {
            if (!running) return;

            // 現在のピクセルを塗る
            ctx.fillStyle = getColor(colorX);
            ctx.fillRect(x, y, 1, 1);

            // 次の座標へランダム移動
            moveRandomly();

            // 色を更新
            colorX += 1;

            // ループを指定したFPSで実行
            setTimeout(draw, 1000 / fps);
        }

        // クリックで停止/再開の切り替え
        canvas.addEventListener('click', () => {
            running = !running;
            if (running) draw();
        });

        // 最初の描画
        draw();
    </script>
</body>
</html>
